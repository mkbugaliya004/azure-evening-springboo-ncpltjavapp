apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic
spec:
  replicas: 1

  selector:
    matchLabels:
      app: spring-petclinic

  template:
    metadata:
      labels:
        app: spring-petclinic

    spec:
      containers:
        - name: spring-petclinic
          image: springbootacr5723.azurecr.io/spring-petclinic:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-service

spec:
  type: LoadBalancer

  selector:
    app: spring-petclinic

  ports:
    - port: 80
      targetPort: 8080
